extends: existence
message: "Avoid '%s'. If the reader is stuck, the word is an insult; if not, it is noise."
link: https://github.com/FhenixProtocol/fhenix-docs/blob/main/STYLE.md#words
level: warning
ignorecase: true
tokens:
  - 'simply'
  - 'simple'
  - 'just'
  - 'easy'
  - 'easily'
  - 'obviously'
  - 'of course'
  - 'trivial(ly)?'
  - 'straightforward'
