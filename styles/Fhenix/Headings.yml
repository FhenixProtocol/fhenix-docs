extends: capitalization
message: "Headings use sentence case: '%s'."
link: https://github.com/FhenixProtocol/fhenix-docs/blob/main/STYLE.md#page-structure
level: warning
scope: heading
match: $sentence
indicators:
  - ':'
exceptions:
  - CoFHE
  - FHE
  - FheOS
  - Teecryptor
  - SDK
  - API
  - ACL
  - ACP
  - ACPs
  - TEE
  - ZK
  - MPC
  - EVM
  - ERC
  - ERC20
  - FHERC20
  - Solidity
  - Hardhat
  - Foundry
  - Fhenix
  - TaskManager
  - CommitmentRegistry
  - Threshold Network
  - FHE Engine
  - JavaScript
  - TypeScript
  - React
  - Node
  - GitHub
  - I
