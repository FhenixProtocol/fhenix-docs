name: Tutorial examples

on:
  pull_request:
    paths:
      - 'cofhe/tutorials/**'
      - 'cofhe/scripts/check-example-regions.py'
      - '.github/workflows/tutorial-examples.yml'
  workflow_dispatch:

concurrency:
  group: tutorial-examples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Readers download these projects and run them, so a project that does not
  # install and pass from a clean checkout is a broken tutorial.
  test:
    name: example projects pass their tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm ci && npm test in each example
        run: |
          for dir in cofhe/tutorials/examples/*/; do
            echo "::group::$dir"
            (cd "$dir" && npm ci --no-audit --no-fund && npm test)
            echo "::endgroup::"
          done

  # The page shows regions of the project files. This keeps them identical, so
  # the code on the page is the code the test above ran.
  regions:
    name: page code matches the example files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 cofhe/scripts/check-example-regions.py --self-test
      - run: python3 cofhe/scripts/check-example-regions.py
