name: Docs versions

on:
  pull_request:
    paths:
      - 'cofhe/**/*.mdx'
      - 'cofhe/scripts/check-versions.py'
      - '.github/workflows/sample-compile.yml'
  # Weekly, so a release upstream surfaces as an issue rather than waiting for
  # someone to notice a stale install command.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: docs-versions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The compatibility page is the source of truth. This asks only whether the rest
  # of the docs agree with it, so it needs no network and cannot fail because a
  # package was published while the pull request was open.
  consistency:
    name: docs match the compatibility page
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 cofhe/scripts/check-versions.py --docs

  # This one does hit the network, and a new release upstream is not a reason to
  # fail an unrelated pull request, so it never runs on one.
  upstream:
    name: compatibility page matches npm
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check npm
        id: check
        run: |
          if python3 cofhe/scripts/check-versions.py --npm > drift.txt 2>&1; then
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          else
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          fi
          cat drift.txt

      # One open issue at a time. A second week of drift comments on the first
      # rather than filing a duplicate.
      - name: Open or update an issue
        if: steps.check.outputs.drifted == 'true' && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = [
              'The compatibility page is behind what is published on npm.',
              '',
              '```',
              fs.readFileSync('drift.txt', 'utf8').trim(),
              '```',
              '',
              'Update `cofhe/get-started/introduction/compatibility.mdx`, then run',
              '`python3 cofhe/scripts/check-versions.py --docs` to find every pin that',
              'needs to move with it, including the package pins in',
              '`.github/workflows/sample-compile.yml`.',
            ].join('\n');

            const title = 'Docs versions are behind npm';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'version-drift',
            });

            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['version-drift'],
                body,
              });
            }
